# docker compose up -d   → web on http://127.0.0.1:3000 with its own PostgreSQL.
# Put a reverse proxy with HTTPS (Caddy, Nginx, Traefik…) on the same host in front of it for
# takumilabs.org. The app port is bound to loopback only: it must not be reachable without the proxy.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only. X-Forwarded-For (below) is trusted, so a client that could reach this port
      # directly could choose its own address and get around the sign-in rate limits.
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgres://takumi:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}@db:5432/takumi
      ORIGIN: ${ORIGIN:?define ORIGIN in .env (public URL, e.g. https://takumilabs.org)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@takumilabs.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RELEASE_API_TOKEN: ${RELEASE_API_TOKEN:-}
      # Real client IPs for rate limiting. Only correct when every request comes through exactly
      # one proxy that appends the peer address (nginx `$proxy_add_x_forwarded_for`, Caddy and
      # Traefik by default). Raise XFF_DEPTH if there are more trusted hops (e.g. Cloudflare + nginx).
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: takumi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takumi']
      interval: 5s
      retries: 10

volumes:
  pgdata:
