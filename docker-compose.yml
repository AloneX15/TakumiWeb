# docker compose up -d   → web on http://localhost:3000 with its own PostgreSQL.
# Put a reverse proxy with HTTPS (Caddy, Nginx, Traefik…) in front for takumilabs.org.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://takumi:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}@db:5432/takumi
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@takumilabs.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RELEASE_API_TOKEN: ${RELEASE_API_TOKEN:-}
      # Real client IPs for rate limiting when behind a reverse proxy.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: takumi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takumi']
      interval: 5s
      retries: 10

volumes:
  pgdata:
